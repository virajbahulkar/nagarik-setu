services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nagriksetu-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nagriksetu}
      POSTGRES_USER: ${DATABASE_USER:-nagriksetu}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-nagriksetu} -d ${DATABASE_NAME:-nagriksetu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nagriksetu-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: nagriksetu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: nagriksetu-api
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: npm run dev:api

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: nagriksetu-web
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_started
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: npm run dev:web

volumes:
  postgres_data:
  minio_data:
